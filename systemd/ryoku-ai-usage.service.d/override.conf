[Unit]
# Use the repository collector from ~/.local/bin. It survives `ryoku update`,
# which only rewrites /usr/bin and the shipped shell tree.
# Remove this drop-in to fall back to /usr/bin/opencode-usage.

[Service]
ExecStart=
ExecStart=-/usr/bin/claude-usage
ExecStart=-/usr/bin/codex-usage
ExecStart=-%h/.local/bin/opencode-usage-v2
